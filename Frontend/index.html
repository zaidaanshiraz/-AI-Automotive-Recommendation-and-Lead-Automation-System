<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoLeads AI - Form</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --red: #e94560; --dark: #0a0a14; --sidebar: #161625; --card: #12121f; --border: #2a2a35; --text: #c8cfe8; --muted: #64748b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
  
  /* Unified Sidebar */
  .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 30px 20px; display: flex; flex-direction: column; }
  .brand { font-family: 'Bebas Neue', cursive; font-size: 32px; color: var(--red); text-align: center; margin-bottom: 40px; letter-spacing: 2px; }
  .nav-links { display: flex; flex-direction: column; gap: 10px; }
  .nav-links a { text-decoration: none; color: var(--muted); padding: 14px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
  .nav-links a:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .nav-links a.active { background: var(--red); color: #fff; }

  /* Main Content Area */
  .main-content { flex: 1; overflow-y: auto; display: flex; align-items: center; justify-content: center; padding: 30px; }
  
  /* Form Card */
  .wrapper { width: 100%; max-width: 500px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 36px 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .card-title { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .card-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
  
  .field { margin-bottom: 20px; }
  label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; letter-spacing: 1px; }
  input, select { width: 100%; background: #0f0f19; border: 1px solid var(--border); border-radius: 10px; padding: 13px 16px; color: #fff; outline: none; font-family: 'DM Sans', sans-serif; }
  input:focus, select:focus { border-color: var(--red); }
  
  .btn { width: 100%; background: var(--red); border: none; border-radius: 12px; padding: 16px; font-weight: 600; color: #fff; cursor: pointer; margin-top: 8px; font-size: 15px; transition: 0.2s; }
  .btn:hover { background: #d63d56; transform: translateY(-2px); }
  .status { margin-top: 16px; padding: 14px; border-radius: 10px; display: none; font-size: 14px; text-align: center; }
  .status.success { background: rgba(34,197,94,0.1); color: #4ade80; display: block; border: 1px solid rgba(34,197,94,0.3); }
  .status.loading { background: rgba(255,255,255,0.05); color: var(--text); display: block; border: 1px solid var(--border); }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="brand">AutoLeads AI</div>
  <nav class="nav-links">
    <a href="index.html" class="active">📝 New Lead Intake</a>
    <a href="dashboard.html">📊 Live Dashboard</a>
  </nav>
</aside>

<!-- Main Form -->
<main class="main-content">
  <div class="wrapper">
    <div class="card">
      <div class="card-title">Customer Intake</div>
      <div class="card-sub">Generate AI recommendations instantly.</div>

      <div class="field">
        <label>Full Name</label>
        <input type="text" id="name" value="Mohammed Zaidaan Shiraz" required>
      </div>
      <div class="field">
        <label>Phone (WhatsApp)</label>
        <input type="text" id="phone" placeholder="91XXXXXXXXXX" required>
      </div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label>Car Type</label>
          <select id="type">
            <option value="SUV">SUV</option>
            <option value="Sedan">Sedan</option>
            <option value="Hatchback">Hatchback</option>
          </select>
        </div>
        <div>
          <label>Budget (Lakhs)</label>
          <input type="number" id="budgetRange" value="15" min="3" max="100">
        </div>
      </div>
      <div class="field">
        <label>Primary Purpose</label>
        <select id="purpose">
          <option value="Family + City">Family + City</option>
          <option value="Daily Commute">Daily Commute</option>
          <option value="Highway + Road Trips">Highway + Road Trips</option>
        </select>
      </div>

      <button class="btn" id="submitBtn" onclick="submitLead()">Run AI Agent</button>
      <div class="status" id="statusBox"></div>
    </div>
  </div>
</main>
<script>
  // ⚠️ YOUR WEBHOOK URL HERE
  const WEBHOOK_URL = "https://zaidaanisawesome.app.n8n.cloud/webhook-test/automotive-lead";

  async function submitLead() {
    const payload = {
      name: document.getElementById('name').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      email: document.getElementById('email').value.trim(),
      Type: document.getElementById('type').value,
      Purpose: document.getElementById('purpose').value,
      Budget: document.getElementById('budgetRange').value + " lakh"
    };

    const statusBox = document.getElementById('statusBox');
    statusBox.className = 'status loading';
    
    // The "AI Thinking" Sequence Messages
    const loadingSteps = [
      "🧠 Analyzing car preferences...",
      "🚗 Scanning top models in budget...",
      "⚖️ Running competitor comparison...",
      "📄 Generating personalized PDF brochure...",
      "📡 Dispatching to WhatsApp & Email..."
    ];
    
    let currentStep = 0;
    statusBox.textContent = loadingSteps[currentStep];

    // Cycle through the messages every 2.5 seconds
    const loadingInterval = setInterval(() => {
      currentStep++;
      if (currentStep < loadingSteps.length) {
        statusBox.textContent = loadingSteps[currentStep];
      }
    }, 2500);

    try {
      // Send the data to n8n
      await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      // When finished, stop the timer and show Success
      clearInterval(loadingInterval);
      statusBox.className = 'status success';
      statusBox.innerHTML = '<strong>✅ Complete!</strong> Check WhatsApp & Dashboard.';
      
    } catch (err) {
      // If it fails, stop the timer and show Error
      clearInterval(loadingInterval);
      statusBox.className = 'status loading';
      statusBox.style.color = '#ef4444';
      statusBox.style.borderColor = '#ef4444';
      statusBox.textContent = '❌ Connection Error. Ensure your Webhook is active.';
    }
  }
</script>
</body>
</html>

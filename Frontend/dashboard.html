<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoLeads AI - Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --red: #e94560; --dark: #0a0a14; --sidebar: #161625; --card: #12121f; --border: #2a2a35; --text: #e2e8f0; --muted: #64748b; --hot: #ef4444; --warm: #f59e0b; --cold: #3b82f6; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'DM Sans', sans-serif; }
  body { background: var(--dark); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
  
  /* Unified Sidebar */
  .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 30px 20px; display: flex; flex-direction: column; }
  .brand { font-family: 'Bebas Neue', cursive; font-size: 32px; color: var(--red); text-align: center; margin-bottom: 40px; letter-spacing: 2px; }
  .nav-links { display: flex; flex-direction: column; gap: 10px; }
  .nav-links a { text-decoration: none; color: var(--muted); padding: 14px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
  .nav-links a:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .nav-links a.active { background: var(--red); color: #fff; }

  /* Main Content Area */
  .main-content { flex: 1; padding: 30px; overflow-y: auto; }
  
  /* Dashboard Header */
  .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; }
  .title-group h1 { font-size: 26px; color: #fff; margin-bottom: 5px; }
  .title-group p { color: var(--muted); font-size: 14px; }
  
  /* Refresh Button & Sync Status */
  .controls-group { display: flex; align-items: center; gap: 15px; }
  .refresh-btn { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
  .refresh-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .refresh-btn:active { transform: scale(0.95); }
  
  .sync-status { font-size: 12px; color: #10b981; display: flex; align-items: center; gap: 6px; font-weight: 600; letter-spacing: 1px; background: rgba(16, 185, 129, 0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.2); }
  .live-indicator { display: inline-block; width: 8px; height: 8px; background: #10b981; border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0% { opacity: 1; box-shadow: 0 0 0 0 rgba(16,185,129,0.4); } 70% { opacity: 0.8; box-shadow: 0 0 0 6px rgba(16,185,129,0); } 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16,185,129,0); } }

  /* Stat Cards */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
  .stat-card { background: var(--sidebar); padding: 25px; border-radius: 16px; border: 1px solid var(--border); text-align: center; position: relative; overflow: hidden; }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; }
  .stat-card.total::before { background: #8b5cf6; }
  .stat-card.hot::before { background: var(--hot); }
  .stat-card.warm::before { background: var(--warm); }
  .stat-card.cold::before { background: var(--cold); }
  .stat-num { font-size: 36px; font-weight: 800; color: #fff; margin-bottom: 5px; }
  .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

  /* Charts & Table */
  .dashboard-body { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
  .chart-container, .table-container { background: var(--sidebar); padding: 25px; border-radius: 16px; border: 1px solid var(--border); }
  h3 { margin-bottom: 20px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  
  .table-container { overflow-y: auto; max-height: 400px; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th { padding: 12px; border-bottom: 2px solid var(--border); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px;}
  td { padding: 15px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  tr:hover { background: rgba(255,255,255,0.02); }
  
  .badge { padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;}
  .badge.hot { background: rgba(239, 68, 68, 0.15); color: var(--hot); }
  .badge.warm { background: rgba(245, 158, 11, 0.15); color: var(--warm); }
  .badge.cold { background: rgba(59, 130, 246, 0.15); color: var(--cold); }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="brand">AutoLeads AI</div>
  <nav class="nav-links">
    <a href="index.html">📝 New Lead Intake</a>
    <a href="dashboard.html" class="active">📊 Live Dashboard</a>
  </nav>
</aside>

<!-- Main Dashboard -->
<main class="main-content">
  <div class="header">
    <div class="title-group">
      <h1>Dashboard Operations</h1>
      <p>Tracking AI sentiment and lead processing in real-time</p>
    </div>
    <div class="controls-group">
      <button id="refreshBtn" class="refresh-btn">🔄 Refresh Data</button>
      <div class="sync-status">
        <div class="live-indicator"></div> LIVE STREAM ACTIVE
      </div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card total"><div class="stat-num" id="countTotal">0</div><div class="stat-label">Total Leads</div></div>
    <div class="stat-card hot"><div class="stat-num" id="countHot">0</div><div class="stat-label">Hot Leads</div></div>
    <div class="stat-card warm"><div class="stat-num" id="countWarm">0</div><div class="stat-label">Warm Leads</div></div>
    <div class="stat-card cold"><div class="stat-num" id="countCold">0</div><div class="stat-label">Cold Leads</div></div>
  </div>

  <div class="dashboard-body">
    <div class="chart-container">
      <h3>Market Demand</h3>
      <canvas id="typeChart"></canvas>
    </div>
    
    <div class="table-container">
      <h3>Recent Leads Stream</h3>
      <table>
        <thead>
          <tr><th>Name</th><th>Requested Type</th><th>Budget</th><th>AI Score</th></tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="4" style="text-align: center; color: #64748b;">Initializing connection...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
// ==========================================
// ⚠️ PASTE YOUR GOOGLE SHEET CSV LINK HERE:
// ==========================================
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_-f-MJz3AnvBaKq3ZM11zHHM1IR1c7X0a4XnSUL-vjG59AtMNgNzpJjxBV6m2RTJbj4Jqd3ibNLvd/pub?gid=0&single=true&output=csv";

let chartInst = null;

// Manual Refresh Button Logic
document.getElementById('refreshBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshBtn');
  btn.innerHTML = '⏳ Fetching...';
  btn.style.pointerEvents = 'none'; // Disable click while loading
  await loadData();
  setTimeout(() => {
    btn.innerHTML = '🔄 Refresh Data';
    btn.style.pointerEvents = 'auto';
  }, 500); // Slight delay so it feels responsive
});

// Start everything the moment the page opens
window.onload = () => {
  loadData(); 
  // Auto-Refresh silently every 10 seconds
  setInterval(() => { loadData(true); }, 10000);
};

// Robust CSV Parser
function parseCSV(str) {
    const arr = []; let quote = false; let row = 0, col = 0;
    for (let c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c+1];
        arr[row] = arr[row] || []; arr[row][col] = arr[row][col] || '';
        if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
        if (cc == '"') { quote = !quote; continue; }
        if (cc == ',' && !quote) { ++col; continue; }
        if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc == '\n' && !quote) { ++row; col = 0; continue; }
        if (cc == '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
    }
    return arr;
}

async function loadData(silent = false) {
  if (!CSV_URL || CSV_URL === "YOUR_GOOGLE_SHEET_CSV_URL_HERE") {
    console.warn("Please add your CSV URL to the code!");
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; color: #ef4444;">Please add your CSV URL to the code!</td></tr>';
    return;
  }

  try {
    // Add a random timestamp to the end of the URL to prevent Google from giving us cached (old) data
    const noCacheUrl = CSV_URL + "&t=" + new Date().getTime();
    
    const res = await fetch(noCacheUrl);
    if (!res.ok) throw new Error("HTTP Error");
    const text = await res.text();
    const dataArray = parseCSV(text);
    if (dataArray.length < 2) return;

    const headers = dataArray[0].map(h => h.trim().toLowerCase());
    const nameIdx = headers.indexOf('name');
    const typeIdx = headers.indexOf('type');
    const budgetIdx = headers.indexOf('budget');
    // Look for anything containing "score"
    const scoreIdx = headers.findIndex(h => h.includes('score'));

    let hot = 0, warm = 0, cold = 0, totalLeads = 0;
    const types = {};
    let tableHTML = '';

    // Read backwards to show newest leads at the top
    for (let i = dataArray.length - 1; i >= 1; i--) {
      const r = dataArray[i];
      if (r.length < 3 || !r[nameIdx] || r[nameIdx].trim() === '') continue; 
      
      totalLeads++;
      const leadName = r[nameIdx].trim();
      const carType = (typeIdx > -1 && r[typeIdx]) ? r[typeIdx].trim() : 'Unknown';
      const budget = (budgetIdx > -1 && r[budgetIdx]) ? r[budgetIdx].trim() : '-';
      const scoreRaw = (scoreIdx > -1 && r[scoreIdx]) ? r[scoreIdx].toLowerCase() : '';
      
      let scoreBadge = '<span class="badge cold">COLD</span>';
      if (scoreRaw.includes('hot')) { hot++; scoreBadge = '<span class="badge hot">HOT</span>'; }
      else if (scoreRaw.includes('warm')) { warm++; scoreBadge = '<span class="badge warm">WARM</span>'; }
      else { cold++; }

      if (carType && carType !== 'Unknown') types[carType] = (types[carType] || 0) + 1;

      tableHTML += `<tr><td style="font-weight: 600; color: #fff;">${leadName}</td><td>${carType}</td><td style="color: #10b981;">₹ ${budget.replace(' lakh', 'L')}</td><td>${scoreBadge}</td></tr>`;
    }

    // Update UI Elements
    document.getElementById('countTotal').innerText = totalLeads;
    document.getElementById('countHot').innerText = hot;
    document.getElementById('countWarm').innerText = warm;
    document.getElementById('countCold').innerText = cold;
    document.getElementById('tableBody').innerHTML = tableHTML || '<tr><td colspan="4" style="text-align: center;">No valid data found.</td></tr>';

    // Update Chart without flashing
    if (chartInst) chartInst.destroy();
    chartInst = new Chart(document.getElementById('typeChart'), {
      type: 'doughnut',
      data: {
        labels: Object.keys(types),
        datasets: [{ data: Object.values(types), backgroundColor: ['#e94560','#3b82f6','#10b981','#8b5cf6','#f59e0b'], borderWidth: 0 }]
      },
      options: { cutout: '70%', animation: { duration: silent ? 0 : 1000 }, plugins: { legend: { position: 'bottom', labels: { color: '#e2e8f0', padding: 20 } } } }
    });

  } catch (error) {
    console.error("Data Fetch Error:", error);
    document.getElementById('tableBody').innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ef4444;">Error loading data. Check console for details.</td></tr>`;
  }
}
</script>
</body>
</html>
